[package]
name = "plush"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "A fast, minimal notification daemon for wlroots-based Wayland compositors"
license = "MIT"
repository = "https://github.com/codethare/plush"

[dependencies]
async-channel = "2"
async-io = "2"
calloop = "0.14"
calloop-wayland-source = "0.4"
cosmic-text = "0.19"
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = "0.12"
toml = "0.9"
wayland-client = "0.31"
zbus = "5.19"
zvariant = "5.15"

