# plush configuration.
#
# This file is the default. It is compiled into the binary and used whenever there is no
# user configuration at $XDG_CONFIG_HOME/plush/config.toml, which is
# ~/.config/plush/config.toml unless XDG_CONFIG_HOME has been moved. Copy it there to
# change anything; the look below is the default one.
#
# Every key is optional and every key below is shown at its default, so deleting a line
# changes nothing. A file that is present but wrong is an error, not a silent fallback.
#
# Colours are #rgb, #rgba, #rrggbb or #rrggbbaa. The alpha channel matters: below ff
# the panel is translucent over whatever is behind it. Sizes are logical pixels, so a
# dense output renders the same panel at its own resolution; the hairline is the one
# exception and is measured in buffer pixels.

[panel]
# Where the stack sits: top-left, bottom-left, top-center, bottom-center, top-right or
# bottom-right. A panel arrives from the edge its position is nearest, so the sides slide
# in sideways and the centred ones drop in from above or rise from below.
position = "top-right"

[border]
# Stroke width in buffer pixels: 1 stays one device pixel thin on a dense output.
# 0 draws no hairline.
width = 1.0
# The hairline's lit ink: solid along the top edge, fading out over the panel height,
# over a fixed dark underside that joins it to the shadow.
color = "#ffffff22"

[background]
# Dark "system" grey, translucent.
color = "#1e1e1ed4"

[countdown]
# The panel edge the countdown line runs along: "top" and "bottom" are horizontal bars,
# "left" and "right" vertical ones. It drains from the far end of that edge, so a
# horizontal bar starts at the left and a vertical one at the top.
position = "bottom"

[animation]
# Slide and fade each panel in from the right, and back out when it goes away.
# Off makes panels appear and vanish instantly.
enabled = true

[font]
# Any installed family name, or the generic sans-serif, serif, monospace, cursive, fantasy.
family = "sans-serif"

# The app name line.
app-size = 11.0
app-line-height = 15.0
app-weight = "medium"

# The summary line. "bold" rather than "semibold" is deliberate: fontconfig resolves
# weight 600 for the generic sans family to a serif CJK face whose space glyph is
# missing, which then falls back to a colour-emoji space seventeen pixels wide.
title-size = 14.0
title-line-height = 19.0
title-weight = "bold"

# The body text.
body-size = 13.0
body-line-height = 18.0
body-weight = "normal"
